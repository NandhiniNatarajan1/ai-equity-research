# Milestone 1 & 2 eval set.
#
# Each entry:
#   id:        stable test id
#   ticker:    company under test (must be ingested)
#   question:  the user's question, as typed in the UI
#   expects:
#     route:              "sec_filing" | "financial"
#     cited_sections:     (sec_filing route only) at least one citation should
#                         hit one of these Items
#     must_contain_any:   answer must mention at least one (case-insensitive)
#     deferred:           true if the SEC Filing Agent should defer (only
#                         meaningful for sec_filing route)
#     metrics_any:        (financial route) answer must cite at least one of
#                         these metric names, OR leave empty to accept any
#     metric_value_near:  (optional, financial) {metric: name, min: n, max: m}
#
# Run with:  pytest -m eval -v

questions:
  # ----- SEC Filing Agent route ---------------------------------------------
  - id: nvda_data_center_competition
    ticker: NVDA
    question: "What does NVIDIA identify as its primary data center competition in its most recent 10-K?"
    expects:
      route: sec_filing
      cited_sections: ["1", "1A"]
      must_contain_any: ["cloud", "hyperscale", "custom silicon", "AMD", "Intel"]

  - id: nvda_export_controls_risk
    ticker: NVDA
    question: "What risks does NVIDIA disclose from U.S. export controls affecting sales to China?"
    expects:
      route: sec_filing
      cited_sections: ["1A"]
      must_contain_any: ["China", "export", "license"]

  - id: nvda_supply_concentration
    ticker: NVDA
    question: "How concentrated is NVIDIA's supply chain for advanced chip manufacturing?"
    expects:
      route: sec_filing
      cited_sections: ["1", "1A"]
      must_contain_any: ["Taiwan", "TSMC", "foundry", "foundries"]

  - id: amd_business_description
    ticker: AMD
    question: "What product segments does AMD operate in, as described in its latest 10-K?"
    expects:
      route: sec_filing
      cited_sections: ["1", "7", "8"]
      must_contain_any: ["Data Center", "Client", "Gaming", "Embedded"]

  - id: amd_ai_strategy
    ticker: AMD
    question: "How does AMD describe its strategy for AI accelerators in its most recent 10-K?"
    expects:
      route: sec_filing
      cited_sections: ["1", "7"]
      must_contain_any: ["Instinct", "MI", "accelerator", "AI"]

  - id: amd_competition_risk
    ticker: AMD
    question: "Which competitors does AMD cite as material risks in its risk factors?"
    expects:
      route: sec_filing
      cited_sections: ["1A"]
      must_contain_any: ["Intel", "NVIDIA", "competition"]

  - id: intc_foundry_strategy
    ticker: INTC
    question: "What does Intel disclose about its foundry (IFS) strategy in its latest 10-K?"
    expects:
      route: sec_filing
      cited_sections: ["1", "1A", "7"]
      must_contain_any: ["foundry", "IFS", "process node", "Intel 18A", "14A"]

  - id: intc_customer_concentration
    ticker: INTC
    question: "Does Intel disclose material customer concentration risk? Summarize what it says."
    expects:
      route: sec_filing
      cited_sections: ["1A", "7"]
      must_contain_any: ["customer", "concentration", "revenue"]

  # ----- Financial Agent route (Milestone 2) --------------------------------
  - id: nvda_revenue_growth
    ticker: NVDA
    question: "What was NVIDIA's revenue growth last year?"
    expects:
      route: financial
      metrics_any: [revenue_yoy_growth]
      must_contain_any: ["%", "revenue"]

  - id: nvda_gross_margin
    ticker: NVDA
    question: "What was NVIDIA's gross margin in the most recent fiscal year?"
    expects:
      route: financial
      metrics_any: [gross_margin]
      must_contain_any: ["%", "margin"]

  - id: amd_fcf
    ticker: AMD
    question: "What was AMD's free cash flow in the most recent fiscal year?"
    expects:
      route: financial
      metrics_any: [free_cash_flow]
      must_contain_any: ["$", "cash flow"]

  - id: intc_operating_margin
    ticker: INTC
    question: "What is Intel's operating margin last fiscal year?"
    expects:
      route: financial
      metrics_any: [operating_margin]
      must_contain_any: ["%", "margin"]
