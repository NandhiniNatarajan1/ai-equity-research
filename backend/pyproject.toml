[project]
name = "ai-equity-research-backend"
version = "0.1.0"
description = "Backend for the AI Equity Research platform (FastAPI, LangGraph, Postgres + pgvector)."
requires-python = ">=3.12"
authors = [{ name = "Nandh" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "httpx>=0.28",
    "tenacity>=9.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tiktoken>=0.8",
    "anthropic>=0.39",
    "voyageai>=0.3",
    "openai>=1.54",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langsmith>=0.1.140",
    "mcp>=1.0",
    "structlog>=24.4",
    "typer>=0.13",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "yfinance>=0.2.50",
    "weasyprint>=63",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-beautifulsoup4",
    "httpx>=0.28",
]

[project.scripts]
aer-ingest = "app.ingestion.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # long lines — long URLs and prompts are fine
    "B008",   # function call in default — FastAPI's Depends() uses this
    "SIM117", # nested `with` — stylistic preference, often clearer
    "SIM105", # try/except/pass — explicit over contextlib.suppress for clarity
    "SIM108", # if/else -> ternary — avoid dense expressions for readability
    "RUF001", # ambiguous unicode in strings — intentional em-dashes in prompts
    "RUF003", # ambiguous unicode in comments — same
    "B905",   # zip without strict= — not a correctness bug here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["pgvector.*", "voyageai.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not eval'"
markers = [
    "eval: end-to-end eval that hits a live DB and LLM (slow, costs money)",
]
